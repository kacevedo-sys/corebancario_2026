<div class="page-container">
  <div class="page-header">
    <div>
      <h1>👤 Clientes</h1>
      <p class="subtitle">
        @switch (modo()) {
          @case ('crear') { Agregar Cliente }
          @case ('editar') { Editar Cliente }
          @case ('ver') { Ver Cliente }
        }
      </p>
    </div>
    <button class="btn btn-outline" (click)="regresar()">← Regresar</button>
  </div>

  <div class="form-card">
    <app-shared-cliente-form
      [cliente]="cliente()"
      [modo]="modo()"
      [guardando]="guardando()"
      (guardar)="guardar($event)">
    </app-shared-cliente-form>
  </div>
</div>
